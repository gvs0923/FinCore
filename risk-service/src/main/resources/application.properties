spring.application.name=risk-service
fincore.risk.pseudonym-key=${FINCORE_RISK_PSEUDONYM_KEY:dev-only-pseudonym-key}
server.address=127.0.0.1

spring.datasource.url=jdbc:postgresql://localhost:5432/fincore
spring.datasource.username=fincore
spring.datasource.password=fincore

spring.flyway.enabled=true
spring.flyway.table=risk_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.data.redis.host=localhost
spring.data.redis.port=6379

server.port=9096
# --- Observability (Phase 6) ---
# Separate management port: the public port never serves /actuator/prometheus.
management.server.port=19096
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
# Same bucket edges as the le_* rollup columns, so both latency views are comparable.
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,2500ms

management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${FINCORE_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# Pull-based metrics (Prometheus) and opt-in trace export, matching the other services.
management.otlp.metrics.export.enabled=${FINCORE_METRICS_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.enabled=${FINCORE_TRACING_EXPORT_ENABLED:false}

fincore.ai.base-url=${FINCORE_AI_BASE_URL:http://localhost:8000}
fincore.ai.scoring.enabled=${FINCORE_AI_SCORING_ENABLED:true}
