plugins {
    id 'org.springframework.boot' version '4.1.1' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'java'
}

allprojects {
    group = 'com.fincore'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    plugins.withId('org.springframework.boot') {
        if (project.name in ['checkout-bff', 'payment-service', 'ledger-service']) {
            dependencies {
                implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
            }
        }
    }

    tasks.named('test') {
        useJUnitPlatform()

        // Colima-specific workarounds — only applied when the Colima socket
        // actually exists (i.e. local dev on macOS). On CI (GitHub Actions /
        // standard Linux Docker) these are skipped so Testcontainers uses its
        // defaults (unix:///var/run/docker.sock, Ryuk enabled).
        def colimaSocket = "${System.getProperty('user.home')}/.colima/default/docker.sock"
        if (System.getenv('DOCKER_HOST') == null && new File(colimaSocket).exists()) {
            environment 'DOCKER_HOST', "unix://${colimaSocket}"
            // Ryuk has known issues starting under Colima's VM; disabling it
            // is the documented workaround. Containers are still cleaned up
            // via Testcontainers' JVM shutdown hooks.
            environment 'TESTCONTAINERS_RYUK_DISABLED', 'true'
        }
    }
}
