apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: postgres } }
  template:
    metadata: { labels: { app.kubernetes.io/name: postgres, fincore/tier: data } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - { name: POSTGRES_DB, value: fincore }
            - { name: POSTGRES_USER, value: fincore }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: fincore-secrets, key: POSTGRES_PASSWORD } }
          ports: [{ name: pg, containerPort: 5432 }]
          readinessProbe: { exec: { command: [pg_isready, -U, fincore, -d, fincore] }, periodSeconds: 5 }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 2Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec: { selector: { app.kubernetes.io/name: postgres }, ports: [{ port: 5432, targetPort: pg }] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: kafka }
spec:
  serviceName: kafka
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: kafka } }
  template:
    metadata: { labels: { app.kubernetes.io/name: kafka, fincore/tier: data } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: kafka
          image: apache/kafka:3.8.1
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@127.0.0.1:9093" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data/logs }
            - { name: CLUSTER_ID, value: MkU3OEVBNTcwNTJENDM2Qk }
          ports: [{ name: kafka, containerPort: 9092 }]
          readinessProbe: { tcpSocket: { port: kafka }, periodSeconds: 5 }
          volumeMounts: [{ name: data, mountPath: /var/lib/kafka/data }]
      securityContext: { fsGroup: 1000 }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 2Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: kafka }
spec: { selector: { app.kubernetes.io/name: kafka }, ports: [{ port: 9092, targetPort: kafka }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: redis } }
  template:
    metadata: { labels: { app.kubernetes.io/name: redis, fincore/tier: data } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe: { exec: { command: [redis-cli, ping] }, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec: { selector: { app.kubernetes.io/name: redis }, ports: [{ port: 6379, targetPort: redis }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: keycloak }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: keycloak } }
  template:
    metadata: { labels: { app.kubernetes.io/name: keycloak } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.1
          args: [start-dev, --import-realm]
          env:
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - { name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: admin }
            - { name: KC_HOSTNAME, value: "http://localhost:8180" }
            - { name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true" }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { tcpSocket: { port: http }, periodSeconds: 5 }
          volumeMounts: [{ name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }]
      volumes: [{ name: realm, configMap: { name: keycloak-realm } }]
---
apiVersion: v1
kind: Service
metadata: { name: keycloak }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: keycloak }
  ports: [{ port: 8080, targetPort: http, nodePort: 30180 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: jaeger }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: jaeger } }
  template:
    metadata: { labels: { app.kubernetes.io/name: jaeger } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.5.0
          ports: [{ name: otlp-http, containerPort: 4318 }, { name: ui, containerPort: 16686 }]
---
apiVersion: v1
kind: Service
metadata: { name: jaeger }
spec:
  selector: { app.kubernetes.io/name: jaeger }
  ports: [{ name: otlp-http, port: 4318, targetPort: otlp-http }, { name: ui, port: 16686, targetPort: ui }]
