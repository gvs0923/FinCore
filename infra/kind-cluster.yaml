kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: fincore
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 8080, listenAddress: "127.0.0.1" }
      - { containerPort: 30180, hostPort: 8180, listenAddress: "127.0.0.1" }
