name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: gradle build
        # Ryuk works fine on Linux (GitHub-hosted runners have Docker
        # pre-installed), so we do NOT set TESTCONTAINERS_RYUK_DISABLED
        # here. That env var is a Colima-specific workaround in the
        # root build.gradle and should not leak into CI.

  storefront:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storefront-web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storefront-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle budget
        if: github.event.repository.private == false
        run: npm run check:bundle

      - name: Lighthouse
        if: github.event.repository.private == false
        run: npm run lighthouse

      # Phase 3.5 boundary rule: admin code may import shared shopper
      # modules, but NOTHING outside src/admin may import admin code —
      # that is what keeps an XSS in the storefront from being an
      # admin-shaped XSS. Guard it at source level so the mistake can
      # never reach a bundle.
      - name: Bundle boundary check
        run: |
          violations=$(grep -rnE "from ['\"][^'\"]*admin/" src \
              --include='*.ts' --include='*.tsx' | grep -v '^src/admin/' || true)
          if [ -n "$violations" ]; then
            echo "::error::Shopper code imports admin code:"
            echo "$violations"
            exit 1
          fi

  images:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: [ledger-service, payment-service, checkout-bff, metrics-projection,
                 notification-service, risk-service, settlement-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/jvm.Dockerfile
          build-args: MODULE=${{ matrix.module }}
          push: false
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"

  web-image:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false
      - uses: docker/build-push-action@v6
        with:
          context: storefront-web
          push: false
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
