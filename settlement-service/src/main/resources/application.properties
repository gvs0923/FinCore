spring.application.name=settlement-service
server.port=9097

server.address=127.0.0.1

spring.datasource.url=${FINCORE_DB_URL:jdbc:postgresql://localhost:5432/fincore}
spring.datasource.username=${FINCORE_DB_USERNAME:fincore}
spring.datasource.password=${FINCORE_DB_PASSWORD:fincore}

spring.flyway.enabled=true
spring.flyway.table=settlement_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Scheduled daily batches (00:15 UTC, 7-day catch-up) and processor report
# inbox polling. Report files: settlement_{merchantId}_{currency}_{yyyy-MM-dd}.csv
fincore.settlement.jobs.enabled=${FINCORE_SETTLEMENT_JOBS_ENABLED:true}
fincore.settlement.jobs.batch-cron=${FINCORE_SETTLEMENT_BATCH_CRON:0 15 0 * * *}
fincore.settlement.jobs.reconciliation-poll-ms=${FINCORE_SETTLEMENT_RECON_POLL_MS:60000}
fincore.settlement.reports.inbox=${FINCORE_SETTLEMENT_REPORT_INBOX:${user.home}/.fincore/processor-reports}

spring.kafka.bootstrap-servers=${FINCORE_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=settlement-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all