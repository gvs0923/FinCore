services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: fincore
      POSTGRES_USER: fincore
      POSTGRES_PASSWORD: fincore
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fincore-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  kafka:
    image: apache/kafka:3.8.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      # KRaft mode (no ZooKeeper needed)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: fincore-local-dev-cluster-001
      # JDK in the image SIGILLs on SVE under Colima vz on Apple Silicon
      JAVA_TOOL_OPTIONS: "-XX:UseSVE=0"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: fincore-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  
  keycloak:
    image: quay.io/keycloak/keycloak:26.1   # pin a verified tag
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # The issuer the BROWSER sees. Containers reach Keycloak at keycloak:8080
      # for back-channel calls (token, JWKS); BACKCHANNEL_DYNAMIC allows that.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # JDK in the image SIGILLs on SVE under Colima vz on Apple Silicon
      JAVA_OPTS_APPEND: ${FINCORE_JVM_EXTRA:--XX:UseSVE=0}
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro

volumes:
  fincore-postgres-data:
