spring.application.name=payment-service
server.address=127.0.0.1
spring.kafka.template.observation-enabled=true
management.tracing.propagation.type=w3c
management.otlp.metrics.export.enabled=${FINCORE_METRICS_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.enabled=${FINCORE_TRACING_EXPORT_ENABLED:false}

spring.datasource.url=jdbc:postgresql://localhost:5432/fincore
spring.datasource.username=fincore
spring.datasource.password=fincore


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.table=payment_schema_history
spring.flyway.baseline-on-migrate=true

server.port=9091

# --- Kafka (outbox publisher) ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

fincore.risk.base-url=http://localhost:9096