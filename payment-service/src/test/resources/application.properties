spring.application.name=payment-service

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.table=payment_schema_history
spring.flyway.baseline-on-migrate=true

# --- Kafka: disabled in tests (KafkaTemplate is mocked) ---
spring.kafka.bootstrap-servers=localhost:19092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

# --- Risk: unreachable in tests, exercises RiskClient's fail-open fallback ---
fincore.risk.base-url=http://localhost:1

# --- Observability in tests: random management port, no trace sampling ---
management.server.port=0
management.tracing.sampling.probability=0.0
