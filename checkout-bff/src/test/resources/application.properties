spring.application.name=checkout-bff

# Backend service URLs
fincore.payment.base-url=http://localhost:9091
fincore.ledger.base-url=http://localhost:9090

# CORS
fincore.cors.allowed-origin=http://127.0.0.1:5173

# --- Kafka: create beans but don't start listeners (no broker in tests) ---
spring.kafka.bootstrap-servers=localhost:19092
spring.kafka.consumer.group-id=checkout-bff-test
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.listener.auto-startup=false
