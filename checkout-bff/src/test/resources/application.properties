spring.application.name=checkout-bff
spring.datasource.url=jdbc:h2:mem:checkout;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.schemas=checkout_bff
spring.flyway.default-schema=checkout_bff

# Backend service URLs
fincore.payment.base-url=http://localhost:9091
fincore.ledger.base-url=http://localhost:9090
fincore.metrics.base-url=http://localhost:9095
fincore.settlement.base-url=http://localhost:9097

# Admin auth
fincore.oidc.client-id=test
fincore.oidc.client-secret=test
fincore.oidc.public-base=http://127.0.0.1:5173
spring.profiles.active=test
fincore.oidc.browser-base=http://localhost:1/realms/test
fincore.oidc.backchannel-base=http://localhost:1/realms/test
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:1/realms/test
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:1/realms/test/certs
spring.security.oauth2.resourceserver.jwt.audiences=fincore-bff

# CORS
fincore.cors.allowed-origin=http://127.0.0.1:5173

# --- Kafka: disabled entirely in tests (no broker available) ---
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
