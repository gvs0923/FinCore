spring.application.name=checkout-bff
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
management.tracing.propagation.type=w3c
management.otlp.metrics.export.enabled=${FINCORE_METRICS_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.enabled=${FINCORE_TRACING_EXPORT_ENABLED:false}
spring.datasource.url=${FINCORE_DB_URL:jdbc:postgresql://localhost:5432/fincore}
spring.datasource.username=${FINCORE_DB_USERNAME:fincore}
spring.datasource.password=${FINCORE_DB_PASSWORD:fincore}
spring.flyway.schemas=checkout_bff
spring.flyway.default-schema=checkout_bff
server.port=8089

# Backend service URLs
fincore.payment.base-url=http://localhost:9091
fincore.ledger.base-url=http://localhost:9090
fincore.metrics.base-url=http://localhost:9095
fincore.risk.base-url=http://localhost:9096
fincore.settlement.base-url=http://localhost:9097


# --- OIDC (Phase 6) ---
fincore.oidc.client-id=fincore-bff
fincore.oidc.client-secret=${FINCORE_OIDC_CLIENT_SECRET}
fincore.oidc.public-base=${FINCORE_PUBLIC_BASE_URL}
spring.profiles.default=local
server.address=127.0.0.1
# What the browser and the token's "iss" claim use
fincore.oidc.browser-base=http://localhost:8180/realms/fincore
# What this process uses for token/JWKS/userinfo calls (differs inside containers)
fincore.oidc.backchannel-base=${fincore.oidc.browser-base}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${fincore.oidc.browser-base}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${fincore.oidc.backchannel-base}/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences=fincore-bff

server.servlet.session.cookie.name=FINCORE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.servlet.session.timeout=30m

# CORS — only allow the storefront origin
fincore.cors.allowed-origin=http://127.0.0.1:5173

# --- Kafka (for SSE push) ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=checkout-bff
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Request metrics are best-effort: kafka.send() blocks the request thread up to
# max.block.ms (default 60s) when the broker is down. Cap it so a dead broker
# costs ~2s, not 60s, per request.
spring.kafka.producer.properties.max.block.ms=2000
# --- Observability (Phase 6) ---
# Separate management port: the public port never serves /actuator/prometheus.
management.server.port=18089
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
# Same bucket edges as the le_* rollup columns, so both latency views are comparable.
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,2500ms

management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${FINCORE_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
