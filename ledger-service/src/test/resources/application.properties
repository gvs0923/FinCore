spring.application.name=ledger-service

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.table=ledger_schema_history

# --- Kafka: create beans but don't start listeners (no broker in tests) ---
spring.kafka.bootstrap-servers=localhost:19092
spring.kafka.consumer.group-id=ledger-service-test
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.listener.auto-startup=false

# --- Observability in tests: random management port, no trace sampling ---
management.server.port=0
management.tracing.sampling.probability=0.0
