spring.application.name=ledger-service
server.address=127.0.0.1
spring.kafka.listener.observation-enabled=true
management.tracing.propagation.type=w3c
management.otlp.metrics.export.enabled=${FINCORE_METRICS_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.enabled=${FINCORE_TRACING_EXPORT_ENABLED:false}

spring.datasource.url=jdbc:postgresql://localhost:5432/fincore
spring.datasource.username=fincore
spring.datasource.password=fincore

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.table=ledger_schema_history

server.port=9090

# --- Kafka (event consumer + DLT producer) ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=ledger-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer